name: Verify airdrop task links

on:
  push:
    branches:
      - feature/airdrop-task-links

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/airdrop-task-links
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run airdrop policy tests
        run: npm run test:airdrop

      - name: Run lint
        run: npm run lint

      - name: Check changed TypeScript surfaces
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/tsc-output.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "(components/admin/airdrop-review-console|components/airdrop/airdrop-tasks-client|app/api/admin/airdrop/tasks|app/api/airdrop/me|app/api/airdrop/submissions|lib/airdrop/tasks)" /tmp/tsc-output.log; then
            echo "TypeScript reported an error in a changed airdrop surface."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Full-project TypeScript check still has pre-existing errors outside this change; no changed airdrop file is implicated."
          fi

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/verify-airdrop-task-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary airdrop verification workflow"
          git push origin HEAD:feature/airdrop-task-links
