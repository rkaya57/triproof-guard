name: PhishingHook independent source inspection

on:
  push:
    branches:
      - feat/risk-engine-v2-calibration
    paths:
      - .github/workflows/phishinghook-independent-source-inspection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and inspect Zenodo artifact
        shell: bash
        run: |
          set -euo pipefail
          RECORD='15076626'
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://zenodo.org/api/records/${RECORD}" -o phishinghook-record.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('phishinghook-record.json').read_text())
          rows=[]
          for f in r.get('files',[]):
              rows.append({
                  'key': f.get('key'),
                  'size': f.get('size'),
                  'checksum': f.get('checksum'),
                  'download': (f.get('links') or {}).get('content') or (f.get('links') or {}).get('self'),
              })
          print(json.dumps({'record': r.get('id'), 'files': rows}, indent=2))
          Path('phishinghook-record-files.json').write_text(json.dumps(rows, indent=2))
          ziprow=next((x for x in rows if x.get('key')=='phishinghook.zip'),None)
          if not ziprow or not ziprow.get('download'):
              raise SystemExit('phishinghook.zip download URL missing')
          Path('phishinghook-download-url.txt').write_text(ziprow['download'])
          PY
          URL="$(cat phishinghook-download-url.txt)"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            --max-time 600 "$URL" -o phishinghook.zip
          sha256sum phishinghook.zip | tee phishinghook.zip.sha256
          unzip -l phishinghook.zip > phishinghook-zip-list.txt

          # Extract only the nested unique-contract dataset archive. Do not
          # persist the 217 MB parent archive as a workflow artifact.
          unzip -p phishinghook.zip \
            phishinghook/artifact/dataset/contracts/unique_contracts.zip \
            > unique_contracts.zip
          sha256sum unique_contracts.zip | tee unique_contracts.zip.sha256
          unzip -l unique_contracts.zip > unique-contracts-list.txt

          python - <<'PY'
          from pathlib import Path
          import re, json, zipfile

          def zip_paths(list_file):
              paths=[]
              for line in Path(list_file).read_text(errors='replace').splitlines():
                  m=re.match(r'\s*\d+\s+\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}\s+(.+)$', line)
                  if m: paths.append(m.group(1).strip())
              return paths

          parent_paths=zip_paths('phishinghook-zip-list.txt')
          unique_paths=zip_paths('unique-contracts-list.txt')
          sample=[]
          with zipfile.ZipFile('unique_contracts.zip') as z:
              files=[i for i in z.infolist() if not i.is_dir()]
              for info in files[:12]:
                  row={'name':info.filename,'size':info.file_size}
                  if info.file_size <= 32768:
                      raw=z.read(info.filename)
                      try:
                          text=raw.decode('utf-8', errors='replace')
                          row['preview']=text[:1200]
                      except Exception:
                          pass
                  sample.append(row)
          report={
              'parentFileCount':len(parent_paths),
              'uniqueContractArchiveEntries':len(unique_paths),
              'sampleEntries':sample,
          }
          print(json.dumps(report, indent=2))
          Path('phishinghook-unique-contracts-inspection.json').write_text(json.dumps(report, indent=2))
          PY

      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: phishinghook-independent-source-tree
          path: |
            phishinghook-record.json
            phishinghook-record-files.json
            phishinghook.zip.sha256
            phishinghook-zip-list.txt
            unique_contracts.zip.sha256
            unique-contracts-list.txt
            phishinghook-unique-contracts-inspection.json
          if-no-files-found: error
