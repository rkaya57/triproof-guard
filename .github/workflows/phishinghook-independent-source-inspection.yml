name: PhishingHook independent source inspection

on:
  push:
    branches:
      - feat/risk-engine-v2-calibration
    paths:
      - .github/workflows/phishinghook-independent-source-inspection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and inspect Zenodo artifact
        shell: bash
        run: |
          set -euo pipefail
          RECORD='15076626'
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://zenodo.org/api/records/${RECORD}" -o phishinghook-record.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('phishinghook-record.json').read_text())
          rows=[]
          for f in r.get('files',[]):
              rows.append({
                  'key': f.get('key'),
                  'size': f.get('size'),
                  'checksum': f.get('checksum'),
                  'download': (f.get('links') or {}).get('content') or (f.get('links') or {}).get('self'),
              })
          Path('phishinghook-record-files.json').write_text(json.dumps(rows, indent=2))
          ziprow=next((x for x in rows if x.get('key')=='phishinghook.zip'),None)
          if not ziprow or not ziprow.get('download'):
              raise SystemExit('phishinghook.zip download URL missing')
          Path('phishinghook-download-url.txt').write_text(ziprow['download'])
          PY
          URL="$(cat phishinghook-download-url.txt)"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            --max-time 600 "$URL" -o phishinghook.zip
          sha256sum phishinghook.zip | tee phishinghook.zip.sha256
          unzip -p phishinghook.zip \
            phishinghook/artifact/dataset/contracts/unique_contracts.zip \
            > unique_contracts.zip
          sha256sum unique_contracts.zip | tee unique_contracts.zip.sha256

          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, zipfile

          address_re=re.compile(r'^0x[a-fA-F0-9]{40}$')
          report={}
          with zipfile.ZipFile('unique_contracts.zip') as z:
              for name,label in [('unique_phishing.txt','malicious'),('unique_benign.txt','benign')]:
                  raw=z.read(name)
                  text=raw.decode('utf-8', errors='strict')
                  rows=[line.strip() for line in text.splitlines() if line.strip()]
                  invalid=[row for row in rows if not address_re.fullmatch(row)]
                  normalized=[row.lower() for row in rows]
                  report[label]={
                      'sourceFile':name,
                      'rows':len(rows),
                      'uniqueRows':len(set(normalized)),
                      'invalidRows':len(invalid),
                      'sha256':hashlib.sha256(raw).hexdigest(),
                      'normalizedSha256':hashlib.sha256(('\n'.join(sorted(set(normalized)))+'\n').encode()).hexdigest(),
                      'sample':rows[:5],
                  }
                  Path(f'phishinghook-{label}-contracts.txt').write_text('\n'.join(sorted(set(normalized)))+'\n')
          overlap=set(Path('phishinghook-malicious-contracts.txt').read_text().splitlines()) & set(Path('phishinghook-benign-contracts.txt').read_text().splitlines())
          report['crossClassOverlap']=len(overlap)
          if report['malicious']['invalidRows'] or report['benign']['invalidRows']:
              raise SystemExit('invalid EVM address rows found')
          if report['malicious']['uniqueRows'] != report['malicious']['rows'] or report['benign']['uniqueRows'] != report['benign']['rows']:
              raise SystemExit('duplicate addresses found in source label lists')
          if overlap:
              raise SystemExit('cross-class address overlap found')
          print(json.dumps(report, indent=2))
          Path('phishinghook-contract-label-report.json').write_text(json.dumps(report, indent=2))
          PY

      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: phishinghook-independent-source-tree
          path: |
            phishinghook-record-files.json
            phishinghook.zip.sha256
            unique_contracts.zip.sha256
            phishinghook-contract-label-report.json
            phishinghook-malicious-contracts.txt
            phishinghook-benign-contracts.txt
          if-no-files-found: error
