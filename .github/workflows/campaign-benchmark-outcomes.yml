name: Campaign benchmark outcomes

on:
  push:
    branches:
      - feat/campaign-benchmark-outcomes-v1
    paths:
      - "lib/campaign-benchmark/**"
      - "app/api/campaigns/**/metrics/**"
      - "app/dashboard/campaigns/**/metrics/**"
      - "app/dashboard/campaigns/**/layout.tsx"
      - "components/dashboard/campaign-benchmark-dashboard.tsx"
      - ".github/workflows/campaign-benchmark-outcomes.yml"
  pull_request:
    branches:
      - feat/campaign-policy-engine-v1
      - main
    paths:
      - "lib/campaign-benchmark/**"
      - "app/api/campaigns/**/metrics/**"
      - "app/dashboard/campaigns/**/metrics/**"
      - "app/dashboard/campaigns/**/layout.tsx"
      - "components/dashboard/campaign-benchmark-dashboard.tsx"
      - ".github/workflows/campaign-benchmark-outcomes.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Campaign benchmark safeguard tests
        run: node --import tsx --test lib/campaign-benchmark/engine.test.ts lib/campaign-policy/engine.test.ts lib/risk-memory/builder.test.ts lib/telegram/intelligence.test.ts

      - name: Full unit and regression tests
        run: npm test
