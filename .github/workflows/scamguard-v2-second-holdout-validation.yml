name: ScamGuard V2 200-case stratified validation

on:
  push:
    branches:
      - feat/risk-engine-v2-calibration
    paths:
      - "scripts/run-scamguard-v2-second-holdout-validation.ts"
      - "lib/scamguard/v2/calibrated-evidence-fusion.ts"
      - "lib/scamguard/v2/corroboration.ts"
      - "lib/scamguard/v2/transaction-impact.ts"
      - "lib/scamguard/v2/transaction-impact-signals.ts"
      - "lib/scamguard/v2/fixtures/second-holdout-candidates.csv"
      - ".github/workflows/scamguard-v2-second-holdout-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOKENS_XYZ_API_KEY: ${{ secrets.TOKENS_XYZ_API_KEY }}
      PHISHING_DATABASE_FEED_URL: "https://openphish.com/feed.txt"
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      EVM_RPC_URL: ${{ secrets.EVM_RPC_URL }}
      EVM_PUBLIC_THREAT_CORPUS_ENABLED: "true"
      METAMASK_PHISHING_CONFIG_ENABLED: "true"
      SCAMGUARD_SANDBOX_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Run stratified 200-case validation
        run: node --import tsx scripts/run-scamguard-v2-second-holdout-validation.ts
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scamguard-v2-200-case-stratified-validation
          path: artifacts/scamguard-v2-second-holdout-validation/report.json
          if-no-files-found: error
