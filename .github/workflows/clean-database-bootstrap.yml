name: Clean database bootstrap

on:
  push:
    branches:
      - fix/migration-replay-auth-schema-v1
    paths:
      - "prisma/**"
      - "scripts/bootstrap-database.mjs"
      - "scripts/verify-auth-schema.mjs"
      - "scripts/vercel-migrate-deploy.mjs"
      - "docs/database-bootstrap.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/clean-database-bootstrap.yml"
      - "lib/auth/**"
      - "lib/db/**"
  pull_request:
    branches:
      - feat/campaign-benchmark-outcomes-v1
      - main
    paths:
      - "prisma/**"
      - "scripts/bootstrap-database.mjs"
      - "scripts/verify-auth-schema.mjs"
      - "scripts/vercel-migrate-deploy.mjs"
      - "docs/database-bootstrap.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/clean-database-bootstrap.yml"
      - "lib/auth/**"
      - "lib/db/**"

permissions:
  contents: read

jobs:
  clean-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tri_proof_guard
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tri_proof_guard"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tri_proof_guard?schema=public
      NEXTAUTH_SECRET: clean-bootstrap-session-secret-that-is-long-enough
      ACCESS_PASS_SIGNING_SECRET: clean-bootstrap-access-secret-that-is-long-enough
      DEV_ALLOW_INSECURE_SECRETS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap a completely empty database
        run: npm run db:bootstrap

      - name: Verify authentication schema again without mutation
        run: npm run db:verify-auth-schema

      - name: Confirm Prisma migration status
        run: npx prisma migrate status

      - name: Confirm bootstrap is idempotent for an existing migrated database
        run: npm run db:bootstrap

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run full unit and regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build
