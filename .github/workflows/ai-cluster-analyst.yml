name: AI Cluster Analyst safety

on:
  push:
    branches:
      - feat/ai-cluster-analysis-v1
    paths:
      - "lib/ai/cluster-analyst.ts"
      - "lib/ai/cluster-analyst.test.ts"
      - ".github/workflows/ai-cluster-analyst.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/ai/cluster-analyst.ts"
      - "lib/ai/cluster-analyst.test.ts"
      - ".github/workflows/ai-cluster-analyst.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint AI cluster analyst
        run: npx eslint lib/ai/cluster-analyst.ts lib/ai/cluster-analyst.test.ts

      - name: AI cluster safety tests
        run: node --import tsx --test lib/ai/cluster-analyst.test.ts
