name: Stack integration authenticated preview QA

on:
  push:
    branches:
      - qa/stack-integration-auth-preview-v1
    paths:
      - "app/dashboard/campaigns/**"
      - "app/api/campaigns/**"
      - "components/dashboard/**"
      - "lib/campaign-security/**"
      - "lib/risk-graph/**"
      - "lib/risk-memory/**"
      - "lib/campaign-policy/**"
      - "lib/campaign-benchmark/**"
      - "lib/telegram/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/stack-integration-auth-preview-qa.yml"
  pull_request:
    branches:
      - feat/campaign-benchmark-outcomes-v1
      - main
    paths:
      - "app/dashboard/campaigns/**"
      - "app/api/campaigns/**"
      - "components/dashboard/**"
      - "lib/campaign-security/**"
      - "lib/risk-graph/**"
      - "lib/risk-memory/**"
      - "lib/campaign-policy/**"
      - "lib/campaign-benchmark/**"
      - "lib/telegram/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/stack-integration-auth-preview-qa.yml"

permissions:
  contents: read

jobs:
  validate-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tri_proof_guard
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tri_proof_guard"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tri_proof_guard?schema=public
      NEXTAUTH_SECRET: e2e-only-session-secret-that-is-long-enough-for-local-tests
      ACCESS_PASS_SIGNING_SECRET: e2e-only-access-pass-secret-that-is-long-enough
      DEV_ALLOW_INSECURE_SECRETS: "true"
      E2E_TEST_MODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ephemeral QA database schema
        run: npx prisma db push --skip-generate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run full unit and regression suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Run authenticated browser QA
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-stack-qa-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
