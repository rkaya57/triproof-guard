name: ScamGuard V2 frozen Holdout run

on:
  push:
    branches:
      - holdout/scamguard-v2-eval-2026-08-10
    paths:
      - "data/holdout/scamguard-v2-2026-08-10/**"
      - "scripts/scamguard-v2-holdout-runner.ts"
      - ".github/workflows/scamguard-v2-holdout-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      TOKENS_XYZ_API_KEY: ${{ secrets.TOKENS_XYZ_API_KEY }}
      PHISHING_DATABASE_ENABLED: "true"
      SCAMGUARD_SANDBOX_ENABLED: "false"

    steps:
      - name: Checkout evaluation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen engine integrity
        run: |
          git cat-file -e 8561f45c72868ae75e8a5bcfeb554b964717d8ff^{commit}
          git diff --exit-code 8561f45c72868ae75e8a5bcfeb554b964717d8ff -- \
            lib/scamguard \
            app/api/scamguard \
            lib/extension \
            extension

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check runner and frozen code
        run: npx tsc --noEmit

      - name: Run frozen V1 vs V2 Holdout
        id: holdout
        continue-on-error: true
        run: node --import tsx scripts/scamguard-v2-holdout-runner.ts

      - name: Upload Holdout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scamguard-v2-holdout-report
          path: artifacts/scamguard-v2-holdout-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Check V2 provider parity
        id: parity
        if: always() && hashFiles('artifacts/scamguard-v2-holdout-report.json') != ''
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('artifacts/scamguard-v2-holdout-report.json', 'utf8'))
          const scored = report.cases.filter((x) => x.status === 'scored')
          const qualities = scored.flatMap((x) => x.providerQuality || [])
          const eligible = new Set(qualities.filter((x) => x.activationEligible).map((x) => x.source))
          const observed = new Set(qualities.map((x) => x.source))
          const blockers = []

          if (!report.environment.tokensXyzConfigured) blockers.push('TOKENS_XYZ_API_KEY is not configured')
          if (!eligible.has('phishing.database')) blockers.push('phishing.database produced no activation-eligible evidence')
          if (!eligible.has('solana-rpc')) blockers.push('solana-rpc produced no activation-eligible V2 evidence')
          if (!eligible.has('local-brand-registry')) blockers.push('local-brand-registry was not activation-eligible')
          if (!eligible.has('v1-transaction-decoder')) blockers.push('v1-transaction-decoder was not activation-eligible')

          console.log('Observed V2 sources:', [...observed].sort().join(', ') || '(none)')
          console.log('Activation-eligible sources:', [...eligible].sort().join(', ') || '(none)')
          if (blockers.length) {
            console.error('Provider parity blockers:')
            for (const blocker of blockers) console.error(`- ${blocker}`)
            process.exit(1)
          }
          console.log('Provider parity gate passed.')
          NODE

      - name: Enforce decision-grade run
        if: steps.holdout.outcome != 'success' || steps.parity.outcome != 'success'
        run: |
          echo "Holdout is diagnostic only: scoring coverage or V2 provider parity is insufficient."
          echo "Inspect the uploaded report and provider parity output before making any production-readiness claim."
          exit 1
