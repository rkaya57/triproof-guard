name: Labeled Benchmark

on:
  pull_request:
    paths:
      - "data/benchmarks/**"
      - "lib/benchmark/**"
      - "lib/risk-engine/**"
      - "lib/campaign-security/**"
      - "scripts/benchmark-labeled-dataset.ts"
      - "scripts/export-benchmark-labeling-queue.ts"
      - "scripts/compile-reviewed-benchmark.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/labeled-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "data/benchmarks/**"
      - "lib/benchmark/**"
      - "lib/risk-engine/**"
      - "lib/campaign-security/**"
      - "scripts/benchmark-labeled-dataset.ts"
      - "scripts/export-benchmark-labeling-queue.ts"
      - "scripts/compile-reviewed-benchmark.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/labeled-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labeled-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate benchmark tests
        run: npm run test:benchmark

      - name: Run labeled benchmark gate
        run: npm run benchmark:labeled

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint benchmark implementation
        run: >-
          npx eslint
          lib/benchmark
          scripts/benchmark-labeled-dataset.ts
          scripts/export-benchmark-labeling-queue.ts
          scripts/compile-reviewed-benchmark.ts

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labeled-benchmark-report
          path: artifacts/benchmark/
          if-no-files-found: warn
          retention-days: 30
