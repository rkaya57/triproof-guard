name: Payment safety

on:
  pull_request:
    paths:
      - "app/api/billing/**"
      - "app/checkout/**"
      - "components/checkout/**"
      - "lib/billing/**"
      - ".github/workflows/payment-safety.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "app/api/billing/**"
      - "app/checkout/**"
      - "components/checkout/**"
      - "lib/billing/**"
      - ".github/workflows/payment-safety.yml"
      - "package.json"
      - "package-lock.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Billing unit tests
        run: >-
          node --import tsx --test
          lib/billing/credits.test.ts
          lib/billing/plans.test.ts
          lib/billing/sol-price-quote.test.ts
          lib/billing/solana-wallet-client.test.ts
      - name: Billing lint
        run: >-
          npx eslint
          app/api/billing/intent/route.ts
          app/api/billing/sol-quote/route.ts
          app/api/billing/verify-solana/route.ts
          app/checkout/page.tsx
          components/checkout/checkout-form.tsx
          lib/billing/payment-intent.ts
          lib/billing/payment-settlement.ts
          lib/billing/plans.ts
          lib/billing/plans.test.ts
          lib/billing/sol-price-quote.test.ts
          lib/billing/solana-pay.ts
          lib/billing/solana-wallet-client.ts
      - name: Type check
        run: npx tsc --noEmit
