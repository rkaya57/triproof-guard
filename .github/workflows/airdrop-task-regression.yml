name: Airdrop task regression

on:
  pull_request:
    paths:
      - "app/api/admin/airdrop/**"
      - "app/api/airdrop/**"
      - "app/dashboard/airdrop/**"
      - "components/admin/airdrop-review-console.tsx"
      - "components/airdrop/**"
      - "lib/airdrop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/airdrop-task-regression.yml"
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    paths:
      - "app/api/admin/airdrop/**"
      - "app/api/airdrop/**"
      - "app/dashboard/airdrop/**"
      - "components/admin/airdrop-review-console.tsx"
      - "components/airdrop/**"
      - "lib/airdrop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/airdrop-task-regression.yml"

permissions:
  contents: read

jobs:
  airdrop-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run airdrop tests
        run: node --import tsx --test lib/airdrop/tasks.test.ts lib/airdrop/daily-check-in.test.ts

      - name: Type-check airdrop production surfaces
        run: >-
          npx tsc --noEmit --pretty false
          2>&1 | tee /tmp/airdrop-tsc.log;
          test ! -s /tmp/airdrop-tsc.log ||
          ! grep -E "(app/api/airdrop/daily-check-in|app/dashboard/airdrop|components/airdrop/daily-check-in-card|lib/airdrop/daily-check-in)" /tmp/airdrop-tsc.log

      - name: Lint airdrop task surfaces
        run: >-
          npx eslint
          app/api/admin/airdrop/tasks/route.ts
          app/api/airdrop/daily-check-in/route.ts
          app/dashboard/airdrop/page.tsx
          components/airdrop/daily-check-in-card.tsx
          lib/airdrop/tasks.ts
          lib/airdrop/tasks.test.ts
          lib/airdrop/daily-check-in.ts
          lib/airdrop/daily-check-in.test.ts
