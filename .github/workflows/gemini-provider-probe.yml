name: Gemini provider probe safety

on:
  pull_request:
    paths:
      - "lib/ai/gemini-provider-probe.ts"
      - ".github/workflows/gemini-provider-probe.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint lib/ai/gemini-provider-probe.ts
