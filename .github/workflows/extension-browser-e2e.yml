name: Extension Browser E2E

on:
  pull_request:
    paths:
      - "chrome-extension/**"
      - "scripts/extension-browser-e2e.mjs"
      - ".github/workflows/extension-browser-e2e.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - "test/extension-browser-e2e-v1"
    paths:
      - "chrome-extension/**"
      - "scripts/extension-browser-e2e.mjs"
      - ".github/workflows/extension-browser-e2e.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check browser regression
        run: node --check scripts/extension-browser-e2e.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unpacked extension in real Chromium
        run: xvfb-run -a node scripts/extension-browser-e2e.mjs
