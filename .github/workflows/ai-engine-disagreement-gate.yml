name: AI Engine Disagreement Gate safety

on:
  push:
    branches:
      - feat/ai-engine-disagreement-gate
    paths:
      - "lib/ai/evidence-analyst.ts"
      - "lib/ai/evidence-analyst.test.ts"
      - "lib/ai/disagreement-gate.ts"
      - "lib/ai/disagreement-gate.test.ts"
      - ".github/workflows/ai-engine-disagreement-gate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/ai/evidence-analyst.ts"
      - "lib/ai/evidence-analyst.test.ts"
      - "lib/ai/disagreement-gate.ts"
      - "lib/ai/disagreement-gate.test.ts"
      - ".github/workflows/ai-engine-disagreement-gate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint AI disagreement gate
        run: >-
          npx eslint
          lib/ai/evidence-analyst.ts
          lib/ai/evidence-analyst.test.ts
          lib/ai/disagreement-gate.ts
          lib/ai/disagreement-gate.test.ts

      - name: AI evidence and disagreement safety tests
        run: >-
          node --import tsx --test
          lib/ai/evidence-analyst.test.ts
          lib/ai/disagreement-gate.test.ts
