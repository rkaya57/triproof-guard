name: AI Provenance Audit safety

on:
  push:
    branches:
      - feat/ai-provenance-audit-v1
    paths:
      - "lib/ai/provenance.ts"
      - "lib/ai/provenance.test.ts"
      - "lib/ai/provenance-migration.test.ts"
      - "prisma/migrations/20260807204500_ai_evidence_audit/migration.sql"
      - ".github/workflows/ai-provenance-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/ai/provenance.ts"
      - "lib/ai/provenance.test.ts"
      - "lib/ai/provenance-migration.test.ts"
      - "prisma/migrations/20260807204500_ai_evidence_audit/migration.sql"
      - ".github/workflows/ai-provenance-audit.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint AI provenance
        run: >-
          npx eslint
          lib/ai/provenance.ts
          lib/ai/provenance.test.ts
          lib/ai/provenance-migration.test.ts

      - name: AI provenance safety tests
        run: >-
          node --import tsx --test
          lib/ai/provenance.test.ts
          lib/ai/provenance-migration.test.ts
