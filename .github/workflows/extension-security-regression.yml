name: Extension Security Regression

on:
  pull_request:
    paths:
      - "chrome-extension/**"
      - "scripts/extension-wallet-compat.test.mjs"
      - "scripts/extension-wallet-compat-v2.test.mjs"
      - "scripts/extension-privacy-performance.test.mjs"
      - "scripts/validate-chrome-extension.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - "feat/extension-security-hardening-v1"
      - "feat/extension-privacy-performance-v1"
      - "feat/extension-wallet-compat-v2"
    paths:
      - "chrome-extension/**"
      - "scripts/extension-wallet-compat.test.mjs"
      - "scripts/extension-wallet-compat-v2.test.mjs"
      - "scripts/extension-privacy-performance.test.mjs"
      - "scripts/validate-chrome-extension.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  extension-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate extension package
        run: npm run extension:validate

      - name: Run wallet compatibility and bridge tests
        run: npm run extension:test

      - name: Run modern wallet compatibility tests
        run: node --test scripts/extension-wallet-compat-v2.test.mjs

      - name: Run privacy and SPA performance tests
        run: node --test scripts/extension-privacy-performance.test.mjs
