name: PhishingHook transaction holdout evaluation

on:
  push:
    branches:
      - feat/risk-engine-v2-calibration
    paths:
      - scripts/run-scamguard-v2-phishinghook-holdout.ts
      - lib/scamguard/v2/**
      - lib/scamguard/**
      - .github/workflows/phishinghook-transaction-holdout-evaluation.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download sealed PhishingHook holdout artifact
        uses: actions/download-artifact@v4
        with:
          name: phishinghook-transaction-holdout
          path: phishinghook-transaction-holdout
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: rkaya57/triproof-guard
          run-id: 31500719440

      - name: Type-check fresh holdout evaluator
        run: npx tsc --noEmit

      - name: Evaluate sealed fresh holdout
        shell: bash
        env:
          EVM_PUBLIC_THREAT_CORPUS_ENABLED: "true"
          METAMASK_PHISHING_CONFIG_ENABLED: "true"
          SCAMGUARD_SANDBOX_ENABLED: "false"
        run: |
          set -euo pipefail
          npx tsx scripts/run-scamguard-v2-phishinghook-holdout.ts | tee phishinghook-holdout-evaluation.log

      - name: Upload evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: phishinghook-transaction-holdout-evaluation
          path: |
            artifacts/scamguard-v2-phishinghook-holdout/report.json
            phishinghook-holdout-evaluation.log
          if-no-files-found: error
          retention-days: 90
