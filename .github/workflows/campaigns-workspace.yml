name: Campaigns workspace

on:
  push:
    branches:
      - feat/campaigns-workspace-v1
    paths:
      - "components/dashboard/campaigns-workspace.tsx"
      - "components/dashboard/dashboard-shell.tsx"
      - "app/dashboard/campaigns/**"
      - ".github/workflows/campaigns-workspace.yml"
  pull_request:
    branches:
      - feat/campaign-security-core-v1
      - main
    paths:
      - "components/dashboard/campaigns-workspace.tsx"
      - "components/dashboard/dashboard-shell.tsx"
      - "app/dashboard/campaigns/**"
      - ".github/workflows/campaigns-workspace.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and regression tests
        run: npm test
