name: Apply airdrop task links

on:
  push:
    branches:
      - feature/airdrop-task-links
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/airdrop-task-links
          fetch-depth: 0

      - name: Apply changes
        run: |
          python scripts/apply-airdrop-task-links.py
          rm scripts/apply-airdrop-task-links.py
          rm scripts/airdrop-task-links.patch
          rm .github/workflows/apply-airdrop-task-links.yml
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run airdrop policy tests
        run: npm run test:airdrop

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npx tsc --noEmit

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add task links and lock repeat airdrop submissions"
          git push origin HEAD:feature/airdrop-task-links
