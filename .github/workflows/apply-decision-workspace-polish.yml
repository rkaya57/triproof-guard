name: Apply decision workspace polish

on:
  pull_request:
    branches:
      - feat/decision-workspace-2

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/decision-workspace-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply presentation transformation
        run: python scripts/apply-decision-workspace-polish.py
      - name: Commit transformed component to feature branch
        run: |
          if git diff --quiet -- components/analysis/analysis-detail.tsx; then
            echo "No presentation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/analysis/analysis-detail.tsx
          git commit -m "Polish analysis decision workspace"
          git push origin HEAD:feat/decision-workspace-2
