name: Sybil engine benchmark

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: Comma-separated wallet counts
        required: true
        default: "1000,10000,50000"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benchmark
        env:
          BENCHMARK_SIZES: ${{ inputs.sizes }}
        run: npm run benchmark:sybil | tee sybil-benchmark.jsonl

      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: sybil-engine-benchmark
          path: sybil-benchmark.jsonl
          retention-days: 30
