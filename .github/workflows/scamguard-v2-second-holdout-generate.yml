name: ScamGuard V2 second Holdout deterministic generation

on:
  push:
    branches:
      - feat/risk-engine-v2-calibration
    paths:
      - "scripts/generate-scamguard-v2-second-holdout-candidates.mjs"
      - ".github/workflows/scamguard-v2-second-holdout-generate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout calibration branch
        uses: actions/checkout@v4
        with:
          ref: feat/risk-engine-v2-calibration
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate deterministic candidate ledger
        run: node scripts/generate-scamguard-v2-second-holdout-candidates.mjs
      - name: Commit generated ledger when changed
        run: |
          if git diff --quiet -- lib/scamguard/v2/fixtures/second-holdout-candidates.csv; then
            echo "Candidate ledger already matches deterministic generator."
            exit 0
          fi
          git config user.name "Tri-Proof Protocol"
          git config user.email "actions@users.noreply.github.com"
          git add lib/scamguard/v2/fixtures/second-holdout-candidates.csv
          git commit -m "Generate 200-case ScamGuard V2 second Holdout ledger"
          git push origin HEAD:feat/risk-engine-v2-calibration
